<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your Best Appointment Time | Bathroom Excellence</title>
<meta name="description" content="Answer a few quick questions about your bathroom project and we'll match you with the best available appointment. Takes about 60 seconds.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%230e2233'/%3E%3Cg fill='none' stroke='%236fc5cf' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M8 22h24v4a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8v-4z'/%3E%3Cpath d='M12 22V11a4 4 0 0 1 8 0'/%3E%3Cpath d='M17 11h6'/%3E%3C/g%3E%3C/svg%3E">

<style>
  :root {
    --ink: #12222f;
    --body: #4a5c6b;
    --muted: #6d7e8b;
    --line: #dde5ea;
    --bg: #eef3f6;
    --accent: #0f7c8a;
    --accent-dark: #0b616c;
    --accent-soft: #e7f3f4;
    --gold: #c9a86a;
    --gold-line: rgba(201, 168, 106, .38);
    --gold-deep: #b8862f;
    --danger: #b3261e;
    --stone: #0a0a0b;
    --radius: 12px;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    font: 17px/1.6 "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: var(--body);
    /* Dark stone sits behind the video, so there's no white flash while it
       buffers and no bare page if a browser refuses to autoplay. */
    background: var(--stone);
    -webkit-font-smoothing: antialiased;
  }

  h1, h2 { color: var(--ink); line-height: 1.25; margin: 0 0 .5rem; }
  h1 { font-size: clamp(1.5rem, 4vw, 2rem); }
  h2 { font-size: clamp(1.25rem, 3.2vw, 1.55rem); }
  p { margin: 0 0 1rem; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  /* Each new step moves focus to its heading so screen readers land in the right
     place. That focus is bookkeeping, not interaction, so it shows no ring. */
  #screen h1:focus, #screen h2:focus { outline: none; }

  /* ---------- Banner: video + phone, nothing else ---------- */

  .banner {
    padding: 0 0 26px;
    text-align: center;
    background: var(--stone);
    border-bottom: 1px solid var(--gold-line);
  }

  /* Capped near the clip's native 848px so it is never upscaled far enough to
     go soft, and the aspect ratio is reserved up front so the form below does
     not jump once the video loads. */
  .hero-video {
    display: block;
    width: 100%;
    max-width: 880px;
    margin: 0 auto 22px;
    aspect-ratio: 848 / 480;
    object-fit: cover;
    background: var(--stone);
  }

  .banner-phone {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 11px 24px; border-radius: 99px;
    font-weight: 700; color: #f2f3f5; text-decoration: none;
    border: 1px solid var(--gold-line); background: rgba(255,255,255,.04);
    transition: background-color .18s, border-color .18s, color .18s;
  }
  .banner-phone svg { width: 15px; height: 15px; }
  .banner-phone:hover { background: rgba(201,168,106,.14); border-color: var(--gold); color: #fff; }

  .wrap { max-width: 620px; margin: 0 auto; padding: 32px 20px 64px; }

  /* ---------- Progress ---------- */

  .progress { margin-bottom: 18px; }
  /* The bar sits on the video, not on the card, so its track needs to be a
     light scrim rather than the pale grey it used on the old flat ground. */
  .bar { height: 6px; background: rgba(255,255,255,.22); border-radius: 99px; overflow: hidden; }
  .bar span {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent), #29a3ae);
    border-radius: 99px; transition: width .35s cubic-bezier(.4,0,.2,1);
  }
  .progress p {
    margin: 8px 0 0; font-size: .76rem; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; color: #cbd3d9;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }

  /* ---------- Card ---------- */

  .card {
    background: #fff;
    border: 1px solid rgba(255,255,255,.5); border-radius: var(--radius);
    padding: 34px 32px;
    box-shadow: 0 2px 6px rgba(0,0,0,.18), 0 18px 48px rgba(0,0,0,.34);
    animation: rise .28s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .eyebrow {
    font-size: .75rem; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--gold-deep); margin: 0 0 .5rem;
  }
  .lead { color: var(--muted); }
  .help { font-size: .93rem; color: var(--muted); margin: -.2rem 0 1.4rem; }

  /* ---------- Intro ---------- */

  .intro { text-align: center; }
  .intro .lead { max-width: 44ch; margin: 0 auto 1.4rem; }
  .facts { list-style: none; margin: 0 auto 1.8rem; padding: 0; display: inline-grid; gap: 10px; text-align: left; }
  .facts li { display: flex; align-items: center; gap: 11px; font-size: .95rem; color: var(--ink); }
  .facts li::before {
    content: ""; flex: none; width: 15px; height: 8px;
    border-left: 2.5px solid var(--accent); border-bottom: 2.5px solid var(--accent);
    transform: rotate(-45deg) translate(2px, -2px);
  }

  /* ---------- Options ---------- */

  .options { display: grid; gap: 10px; margin-bottom: 20px; }
  .option {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    width: 100%; padding: 16px 18px; text-align: left; font: inherit;
    color: var(--ink); background: #fff; border: 1.5px solid var(--line);
    border-radius: 10px; cursor: pointer;
    transition: border-color .15s, background-color .15s, transform .12s;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); background: #f8fdfd; transform: translateX(2px); }
  .option:disabled { cursor: default; }
  .option i {
    flex: none; width: 21px; height: 21px; border: 2px solid #bfccd5;
    border-radius: 50%; position: relative;
  }
  .option.on { border-color: var(--accent); background: var(--accent-soft); }
  .option.on i { border-color: var(--accent); }
  .option.on i::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }

  /* ---------- Contact fields ---------- */

  /* minmax(0, 1fr) rather than 1fr: a bare 1fr floors each column at the
     content's min-content width, and a text input's intrinsic width (~20
     characters) is wide enough to push the columns past the container. */
  .fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field input { min-width: 0; width: 100%; }
  .field.s1 { grid-column: span 1; }
  .field.s2 { grid-column: span 2; }
  .field.s4 { grid-column: span 4; }
  .field label { font-size: .87rem; font-weight: 600; color: var(--ink); }
  .field input {
    font: inherit; padding: 12px 13px; color: var(--ink);
    background: #fff; border: 1.5px solid var(--line); border-radius: 9px;
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,124,138,.15); }
  .field.bad input { border-color: var(--danger); }
  .field .msg { font-size: .79rem; color: var(--danger); min-height: 1em; }

  /* Consent checkbox. Deliberately outside .fields: that grid stretches every
     input to 100% of its column, which would blow a checkbox up to full width. */
  .consent {
    display: flex; gap: 11px; align-items: flex-start; cursor: pointer;
    margin-top: 18px; font-size: .85rem; line-height: 1.5; color: var(--muted);
  }
  .consent input {
    flex: none; width: 18px; height: 18px; margin-top: 2px;
    accent-color: var(--accent);
  }
  .consent a { color: var(--accent); }

  /* ---------- Buttons ---------- */

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
    padding: 15px 28px; border: none; border-radius: 9px;
    background: var(--accent); color: #fff; transition: background-color .15s;
  }
  .btn:hover { background: var(--accent-dark); color: #fff; }
  .btn:disabled { opacity: .6; cursor: default; }
  .block { width: 100%; }
  .back {
    margin-top: 4px; padding: 8px 2px; font: inherit; font-weight: 600;
    color: var(--muted); background: none; border: none; cursor: pointer;
  }
  .back:hover { color: var(--ink); }

  .err { color: var(--danger); font-weight: 600; font-size: .93rem; margin: 0 0 1rem; }

  /* ---------- Result ---------- */

  .badge {
    width: 58px; height: 58px; margin: 0 auto 18px; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
  }
  .badge svg { width: 28px; height: 28px; }

  /* ---- booking calendar ---- */
  .cal { margin: 22px 0 4px; text-align: left; }

  .cal-day {
    border: 1px solid var(--line); border-radius: 11px;
    padding: 14px 16px; margin-bottom: 10px; background: #fff;
  }
  .cal-day h3 {
    margin: 0 0 10px; font-size: .95rem; font-weight: 600; color: var(--ink);
    letter-spacing: .01em;
  }
  .cal-day h3 span { color: var(--muted); font-weight: 400; }

  .cal-times {
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  }
  .cal-slot {
    appearance: none; -webkit-appearance: none;
    padding: 11px 8px; border-radius: 9px; cursor: pointer;
    border: 1.5px solid #d7e2e8; background: #f7fafb;
    font: inherit; font-size: .93rem; font-weight: 600; color: var(--ink);
    transition: border-color .15s, background .15s, transform .08s;
  }
  .cal-slot:hover:not(:disabled) { border-color: var(--accent); background: #eef7f9; }
  .cal-slot:active:not(:disabled) { transform: translateY(1px); }
  .cal-slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cal-slot:disabled { opacity: .5; cursor: default; }

  .cal-more {
    margin: 4px 0 0; font-size: .88rem; color: var(--muted); text-align: center;
  }
  .cal-more button {
    appearance: none; background: none; border: 0; padding: 6px 4px;
    font: inherit; font-size: .88rem; color: var(--accent);
    text-decoration: underline; cursor: pointer;
  }

  /* Jack's decision-maker instruction, above the time picker. Deliberately
     louder than .note - it is the one thing a visitor must read before
     choosing, because a slot booked without the co-decider is a wasted visit. */
  .cal-alert {
    margin: 0 0 18px; padding: 15px 17px; border-radius: 10px;
    background: #fff8e8; border: 1px solid var(--gold-line);
    border-left: 4px solid var(--gold-deep);
    font-size: 1.06rem; font-weight: 700; line-height: 1.45;
    color: var(--ink); text-align: left;
  }

  .cal-alert-sub { display: block; margin-top: 9px; }
  .cal-alert-sub strong { color: var(--gold-deep); }

  /* Sits directly under the red box on the confirmation screen, so the way
     out is next to the reason for taking it. */
  .back-warn {
    display: block; width: 100%; margin: 12px 0 0;
    padding: 13px 20px; border-radius: 9px; cursor: pointer;
    border: 1.5px solid #e0a09c; background: #fff;
    font: inherit; font-size: 1rem; font-weight: 700; color: var(--danger);
    transition: background-color .15s, border-color .15s;
  }
  .back-warn:hover { background: #fdf3f2; border-color: var(--danger); }
  .back-warn:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }

  .note {
    margin: 22px 0 0; padding: 16px 18px; border-radius: 10px;
    background: #f7fafb; border: 1px solid var(--line);
    font-size: .94rem; text-align: left;
  }
  .note strong { color: var(--ink); }

  .warn {
    margin-top: 18px; padding: 14px 16px; border-radius: 9px;
    background: #fdf3f2; border: 1px solid #f2d3d0; color: #8c231d;
    font-size: .92rem; text-align: left;
  }

  .spinner {
    width: 38px; height: 38px; margin: 24px auto; border-radius: 50%;
    border: 3px solid #e0e8ed; border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fine {
    margin: 20px auto 0; max-width: 44ch; text-align: center;
    font-size: .81rem; color: #c2cad1; text-shadow: 0 1px 3px rgba(0,0,0,.55);
  }

  @media (max-width: 560px) {
    .banner { padding: 0 0 22px; }
    .hero-video { margin-bottom: 18px; }
    .wrap { padding: 22px 16px 48px; }
    .card { padding: 24px 20px; }
    /* Two columns on phones: everything stacks except State and ZIP, which
       are short enough to share a row. */
    .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .field.s4, .field.s2 { grid-column: span 2; }
    .field.s1 { grid-column: span 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<body>

<header class="banner">

  <!-- poster holds the logo still in the video's box until the first frame is
       ready, then the video takes over on its own. Upload the logo to this
       repository as logo.jpg for it to appear. -->
  <video class="hero-video" autoplay muted loop playsinline preload="auto"
         poster="logo.jpg"
         aria-label="Bathroom Excellence" disablepictureinpicture>
    <source src="bathroom-background.mp4" type="video/mp4">
  </video>

  <a class="banner-phone" href="tel:+16367954643">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.24 11.4 11.4 0 003.6.58 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.58 3.6a1 1 0 01-.25 1z" fill="currentColor"/></svg>
    (636) 795-4643
  </a>

</header>

<main class="wrap">

  <div class="progress" id="progress" role="progressbar"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress" hidden>
    <div class="bar"><span id="barFill"></span></div>
    <p id="barLabel"></p>
  </div>

  <div id="screen"></div>

  <p class="fine">Your information is used only to schedule and confirm your appointment. We never sell your data.</p>

  <noscript>
    <div class="card">
      <h1>Let's get you scheduled</h1>
      <p>This form needs JavaScript. Please call <a href="tel:+16367954643">(636) 795-4643</a>
         and we'll book your free in-home consultation over the phone.</p>
    </div>
  </noscript>

</main>

<script>
(function () {
  'use strict';

  /* ==================================================================
     1. PASTE YOUR MAKE.COM WEBHOOK URL HERE
     ------------------------------------------------------------------
     In Make.com: add a "Custom webhook" trigger, click "Copy address to
     clipboard", and paste it between the quotes below. It looks like:
     https://hook.us1.make.com/abcdef1234567890abcdef1234567890

     Currently pointed at the "BE Scored Form - Inbound" webhook, which
     feeds the "BE - Scored Web Form -> Builder Prime" scenario.
     ================================================================== */
  var WEBHOOK_URL = 'https://hook.us1.make.com/momgk27f817s6lpdd415un4oixkd7non';

  /* ==================================================================
     2. BOOKING CALENDAR
     ------------------------------------------------------------------
     High-priority leads (score >= 80) see live availability and book
     themselves. Two Make webhooks back it:

       AVAILABILITY_URL - "BE Calendar - Availability". Returns what is
       already busy: Builder Prime meetings for the next 28 days (agent
       id + start/end only, no customer details) plus any blackout rows
       from the BE Slot Inventory data store.

       BOOK_URL - "BE Calendar - Book". Claims the slot, then hands off
       to the existing "Script Form 1" webhook, which is what actually
       creates the Builder Prime meeting and writes the tracking sheet.
       Returns 409 if someone took the slot first.

     Leave either empty to fall back to the "we'll call you" message.
     ================================================================== */
  var AVAILABILITY_URL = 'https://hook.us1.make.com/7gsn1pbwj987s5dysghdnwk6buf69yqt';
  var BOOK_URL = 'https://hook.us1.make.com/v779dp9g9nl2syr8n9armlywo89sck74';

  /* Disqualified leads go to their own scenario, not the normal intake one.
     They must never reach the standard alert or the call queue - Jack does not
     want them chased. Blank this and they fall back to the normal webhook. */
  var DQ_WEBHOOK_URL = 'https://hook.us1.make.com/bw6enqb1hs17vmmg2iho0numqgtbaclf';

  /* The form always claims "Scored Web Form" as the source, but a shared/resold
     lead (Home Advisor, Modernize, QuinStreet, Thumbtack) really came from a
     vendor other companies also got - and Jack loses appointments to people
     who won't sign until those other quotes have been seen. The booking
     scenario already looks this up AFTER a slot is picked and floors the
     score accordingly, but by then it's too late to change which slots were
     even offered. "BE - Web Lead Source Check" runs the same Builder Prime
     lookup before the calendar renders, purely so buildDays() can push the
     earliest slot out the same way it already does for a self-reported
     "no quote yet" answer. Leave blank to skip the check entirely - the
     calendar just won't know about shared leads until after booking. */
  var LEAD_SOURCE_URL = 'https://hook.us1.make.com/oklhm3ooe16wpacr2rcukt7863ufy4ae';

  /* Never let a slow Builder Prime lookup hold up the calendar. If it hasn't
     answered by the time the main submission has, book as if it weren't
     shared - the after-the-fact score check on the Make side still catches
     it, so the only cost of a miss here is a slightly earlier slot offered,
     never a lost booking. */
  var LEAD_SOURCE_TIMEOUT_MS = 4000;

  /* Filled in by checkLeadSource(), read by buildDays(). Defaults closed
     (not shared) so a lookup that never runs or never resolves behaves
     exactly like today. */
  var leadSource = { shared: false, source: null };

  function checkLeadSource(phone) {
    if (!LEAD_SOURCE_URL || !phone) return Promise.resolve();

    var timeout = new Promise(function (resolve) {
      setTimeout(resolve, LEAD_SOURCE_TIMEOUT_MS);
    });
    var lookup = fetch(LEAD_SOURCE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phone })
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        leadSource.shared = !!(j && j.shared === 'YES');
        leadSource.source = (j && j.source) || null;
      })
      .catch(function (e) {
        console.error('[Bathroom Excellence] Lead source check failed:', e);
        /* leadSource stays at its closed default. */
      });

    return Promise.race([lookup, timeout]);
  }

  /* ------------------------------------------------------------------
     Who works which days, and the appointment start times. Weekday keys
     are the 3-letter forms Intl produces for en-US.

     `days` is the standing schedule. To block a one-off day (vacation,
     a Saturday off), add a row to the BE Slot Inventory data store with
     primary_status "blackout", the agent's name, and block "ALL" for a
     whole day or the specific time for a single slot.
     ------------------------------------------------------------------ */
  var AGENTS = [
    { name: 'Jack', id: 16410, days: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'] },
    { name: 'Dave', id: 20307, days: ['Tue', 'Wed'] }
  ];

  /* Builder Prime appointments run an hour and start on the hour. */
  var SLOT_TIMES = ['09:00', '10:00', '13:00', '14:00', '17:00', '18:00'];
  var SLOT_MINUTES = 60;

  /* How far out to offer, and how much notice we need before a slot. */
  var HORIZON_DAYS = 21;
  var MIN_NOTICE_HOURS = 18;

  /* Jack wants to be the last quote, not the first. When a lead has not
     already received a quote, push the earliest offer out so the competition
     has been and gone before we arrive. Raised from 72 to 120 hours on
     Jack's instruction - "if they don't have other quotes yet it needs to go
     a minimum of five days out" - and matched to the same five-day rule now
     running on the phone tool. */
  var QUOTE_FIRST_NOTICE_HOURS = 120;

  /* Arnold's rule: only a lead who already holds a quote can be seen at short
     notice. Everyone else is still collecting bids, and Jack has lost whole
     appointments to people who would not sign until the others had been. So
     the delay applies to every answer except "already received a quote". */
  var QUOTE_FIRST_ANSWERS = [
    'I have another appointment scheduled before yours',
    'I will likely have other quotes before your appointment',
    "No, you're the first company I'm speaking with"
  ];

  /* Everything is scheduled in the company's local time, not the
     visitor's - somebody booking from a phone on Pacific time still
     picks a St. Charles morning. */
  var TZ = 'America/Chicago';

  /* The score at or above which a lead gets priority booking. */
  /* Lowered from 80 once the score stopped being the only gate: leads who rule
     out financing are disqualified outright, the $500 keeps decision makers in
     the room, and anyone without a quote in hand waits three days. At 80 a cash
     buyer ready to go still scored 70 and could not book, which is what Jack
     and Melissa kept hitting in testing. */
  var PRIORITY_THRESHOLD = 70;

  /* Jack's one-legger rule. A two-story home where the visitor says they
     decide alone is the pattern behind his worst wasted visits - Dave blew
     off a rescheduled sale to run one. It costs 40 points, but deliberately
     does NOT gate the calendar: the answer to a one-legger is to book it in
     the evening when both people are home, not to refuse the booking. See
     ONE_LEGGER_BAND and the evening override in renderCalendar(). */
  var ONE_LEGGER_PENALTY = -40;
  var ONE_LEGGER_STORY = 'Two or more storeys';
  var ONE_LEGGER_DM = "I'll be making the decision myself";
  var ONE_LEGGER_BAND = ['17:00', '18:00'];

  var PHONE = '(636) 795-4643';

  /* Reschedules go to the tracked line, not the main office number. */
  var RESCHEDULE_PHONE = '800-245-8143';

  /* ------------------------------------------------------------------
     Questions. `points` count toward the raw 0-100 score. `bonus` is the
     internal enthusiasm bonus and deliberately never touches that score.
     `showIf` questions only appear when their trigger answer is chosen.
     ------------------------------------------------------------------ */
  var QUESTIONS = [
    {
      id: 'projectType',
      title: 'What are you looking to have done?',
      help: 'This helps us send the right specialist and bring the right samples.',
      options: [
        { value: 'Replace my tub/shower', points: 0 },
        { value: 'Convert tub to walk-in shower', points: 0 },
        { value: 'Complete bathroom remodel', points: 0 },
        /* A new bathroom is not a remodel: basements bring drainage and often
           an ejector pump, additions bring framing and permits. Named rather
           than filed under "custom" so the segment stays analysable later. */
        { value: 'New bathroom — basement or addition', points: 0 },
        { value: 'Multiple bathrooms', points: 0 },
        /* Named as the product, not as an "accessibility project" — the latter
           reads as grab bars and seats, which is not work we are quoting for. */
        { value: 'Walk-in tub', points: 0 },
        { value: 'Not sure yet', points: 0 }
      ]
    },
    {
      id: 'urgency',
      title: 'When would you ideally like to get your project completed?',
      help: 'We hold different crews for different lead times.',
      options: [
        { value: 'As soon as possible', points: 20 },
        { value: 'Within the next 1-3 months', points: 15 },

      options: [

        { value: "Yes, I've received a quote", points: 40 },

      id: 'houseStory',
      title: 'Is your home a single storey, or two or more?',
      help: 'It tells our consultant what to expect before they arrive.',
      options: [

        { value: 'Two or more storeys', points: 0 }

    },
    {

      id: 'timeOfDay',
      title: 'What time of day works best for everyone involved to be there?',
      help: 'We’ll only show you times in the part of the day you pick.',
      options: [

        { value: 'Afternoon (1:00 PM or 2:00 PM)', points: 0, band: ['13:00', '14:00'] },

    {

    },
    {
      id: 'credit',
      /* Never ask for a score. Softer framing gets truthful answers and fewer
         people abandoning the form here. Points keep the old 20/15/10/5/0
         spread, so scores stay comparable with leads captured before the
         rewording. */
      title: 'If financing were helpful, which best describes your situation?',
      help: 'This only affects which programs we can show you. No credit check happens here.',
      showIf: function (a) { return a.payment === "I'd like to explore financing options"; },
      options: [
        { value: 'Good or excellent credit', points: 20 },
        { value: 'Fair credit', points: 15 },
        { value: 'Prefer to pay cash', points: 10 },
        { value: "I'd like to discuss options", points: 5 },
        /* Jack: this answer takes them out of the running. `disqualify` is read
           by tally(), so the flag lives with the answer rather than being
           re-derived from wording somewhere else. */
        { value: "Financing probably isn't an option", points: 0, disqualify: true }
      ]
    },
    {
      id: 'enthusiasm',
      title: 'How interested are you in getting this project done if we can find an option that fits what you’re looking for?',
      help: "Be honest — there's no wrong answer, and it helps us set the right expectations.",
      options: [
        { value: "Very interested — I'm ready to get this done", points: 0, bonus: 10 },
        { value: 'Interested — I want to see my options', points: 0, bonus: 5 },
        { value: 'Mostly researching right now', points: 0, bonus: 0 }
      ]
    }
  ];

  /* `span` is how many of the 4 grid columns the field occupies. */
  /* Every entry here is REQUIRED - validate() rejects any empty value. The
     SMS/email consent checkbox is deliberately not in this array: TCPA forbids
     making consent a condition of booking. It would also break in a way that
     is easy to miss - a checkbox's .value is "on" whether or not it is ticked,
     so validate() would pass and every visitor would be recorded as opted in.
     Read .checked, never .value. */
  var CONTACT_FIELDS = [
    { name: 'fullName', label: 'Full name', type: 'text', autocomplete: 'name', span: 4 },
    { name: 'phone', label: 'Phone number', type: 'tel', autocomplete: 'tel', span: 2 },
    { name: 'email', label: 'Email', type: 'email', autocomplete: 'email', span: 2 },
    { name: 'address', label: 'Street address', type: 'text', autocomplete: 'address-line1', span: 4 },
    { name: 'city', label: 'City', type: 'text', autocomplete: 'address-level2', span: 2 },
    { name: 'state', label: 'State', type: 'text', autocomplete: 'address-level1', span: 1, maxlength: 2, uppercase: true, placeholder: 'MO' },
    { name: 'zip', label: 'ZIP code', type: 'text', autocomplete: 'postal-code', span: 1, maxlength: 5, inputmode: 'numeric', placeholder: '63301' }
  ];

  /* ------------------------------------------------------------------ */

  var screenEl = document.getElementById('screen');
  var progressEl = document.getElementById('progress');
  var barFill = document.getElementById('barFill');
  var barLabel = document.getElementById('barLabel');

  var answers = {};   // questionId -> selected option value
  var history = [];   // questionIds in the order they were answered
  var contact = {};

  /* Marketing-contact consent. Kept out of `contact` because it is consent
     metadata rather than contact detail, and downstream automation reads it
     as its own field. CONSENT_TEXT is submitted with the lead: it records what
     the visitor actually agreed to, which cannot be reconstructed once this
     page is edited. Bump CONSENT_VERSION whenever the wording changes - the
     wording is also what gets registered with the carriers for A2P 10DLC, so
     the two must not drift apart. */
  var smsOptIn = false;
  var smsOptInAt = null;
  var CONSENT_VERSION = '2026-08-v2';
  var CONSENT_HTML =
    'I agree to receive SMS and email communications from Bathroom Excellence ' +
    'regarding my booking request. Consent is not a condition of purchase. ' +
    'Message frequency varies. Message and data rates may apply. Reply STOP to ' +
    'cancel or HELP for assistance. You can unsubscribe from emails at any time. ' +
    'View our <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a> ' +
    'and <a href="privacy.html#sms-terms" target="_blank" rel="noopener">SMS Terms</a>.';
  var CONSENT_TEXT = CONSENT_HTML.replace(/<[^>]+>/g, '');
  var startedAt = new Date().toISOString();

  /* Questions currently in play. Recomputed constantly, because choosing
     financing or "received a quote" adds a question mid-flow. */
  function visible() {
    return QUESTIONS.filter(function (q) {
      return typeof q.showIf !== 'function' || q.showIf(answers);
    });
  }

  function nextUnanswered() {
    var list = visible();
    for (var i = 0; i < list.length; i++) {
      if (answers[list[i].id] === undefined) return list[i];
    }
    return null;
  }

  function optionOf(q, value) {
    for (var i = 0; i < q.options.length; i++) {
      if (q.options[i].value === value) return q.options[i];
    }
    return null;
  }

  /* Two answers read together, never one on its own: a two-story home plus
     "I decide alone". Either answer by itself is perfectly normal. */
  function isOneLegger() {
    return answers.houseStory === ONE_LEGGER_STORY &&
           answers.decisionMakers === ONE_LEGGER_DM;
  }

  /* Raw score = Q2 + Q3 + Q4 + (Q5 or Q6). Enthusiasm is kept out of it. */
  function tally() {
    var raw = 0, bonus = 0, detail = {}, dq = false;

    visible().forEach(function (q) {
      var value = answers[q.id];
      if (value === undefined) return;
      var opt = optionOf(q, value);
      if (!opt) return;

      raw += opt.points || 0;
      bonus += opt.bonus || 0;
      if (opt.disqualify) dq = true;
      detail[q.id] = { question: q.title, answer: value, points: opt.points || 0, bonus: opt.bonus || 0 };
    });

    /* Clamp the positive categories to 100 BEFORE the penalty, so the
       deduction lands on a 0-100 base and a perfect answer set drops to 60
       rather than being absorbed by a higher ceiling - that was the bug on
       the phone tool, where a 140 max made the -40 do nothing. */
    raw = Math.max(0, Math.min(100, raw));
    bonus = Math.max(0, Math.min(10, bonus));

    /* The one-legger deduction is reported but deliberately kept OUT of the
       priority gate. Jack's answer to a one-legger is an evening slot, not a
       refused booking, so a strong buyer who happens to decide alone still
       reaches the calendar - they just only see evening times. Gating on the
       penalised score instead would silently drop a 100 to 60 and push them
       to the callback path. */
    var oneLegger = isOneLegger();
    var scored = oneLegger ? Math.max(0, raw + ONE_LEGGER_PENALTY) : raw;

    return {
      rawScore: scored,
      enthusiasmBonus: bonus,
      effectiveScore: scored + bonus,
      oneLegger: oneLegger,
      oneLeggerPenalty: oneLegger ? ONE_LEGGER_PENALTY : 0,
      scoreBeforePenalty: raw,
      /* Disqualified overrides the score outright. A top answer set with this
         option still totals exactly 80, which is the priority threshold - so
         without this they would be offered the calendar. */
      priority: dq ? 'Disqualified' : (raw >= PRIORITY_THRESHOLD ? 'High' : 'Standard'),
      disqualified: dq,
      detail: detail
    };
  }

  /* ---------- rendering helpers ---------- */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function show(card) {
    screenEl.innerHTML = '';
    card.classList.add('card');
    screenEl.appendChild(card);
    var h = card.querySelector('h1, h2');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* Total steps = visible questions + contact + result. */
  function setProgress(step) {
    var total = visible().length + 2;
    var pct = Math.round((step / total) * 100);
    progressEl.hidden = false;
    progressEl.setAttribute('aria-valuenow', String(pct));
    barFill.style.width = pct + '%';
    barLabel.textContent = 'Step ' + step + ' of ' + total;
  }

  function tick() {
    var s = document.createElement('span');
    s.innerHTML = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10.5l4 4 8-9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return s;
  }

  /* ---------- screen: intro ---------- */

  function renderIntro() {
    progressEl.hidden = true;
    var c = el('div', 'intro');
    c.appendChild(el('p', 'eyebrow', 'Free in-home design consultation'));
    c.appendChild(el('h1', null, 'Find Your Best Appointment Time'));
    c.appendChild(el('p', 'lead',
      'Answer a few quick questions about your bathroom project so we can match you with the best available appointment. Takes about 60 seconds.'));

    var facts = el('ul', 'facts');
    ['No obligation and no pressure', 'Free written estimate at the appointment', 'Most bathrooms finished in 1-3 days']
      .forEach(function (t) { facts.appendChild(el('li', null, t)); });
    c.appendChild(facts);

    var go = el('button', 'btn block', 'Get Started');
    go.type = 'button';
    go.addEventListener('click', renderQuestion);
    c.appendChild(go);

    c.appendChild(el('p', 'help', 'Prefer to talk to someone? Call ' + PHONE + '.'));
    c.querySelector('.help').style.margin = '16px 0 0';
    show(c);
  }

  /* ---------- screen: question ---------- */

  function renderQuestion() {
    var q = nextUnanswered();
    if (!q) return renderContact();

    var list = visible();
    setProgress(list.indexOf(q) + 1);

    var c = el('div');
    c.appendChild(el('p', 'eyebrow', 'Question ' + (list.indexOf(q) + 1)));
    c.appendChild(el('h2', null, q.title));
    if (q.help) c.appendChild(el('p', 'help', q.help));

    var box = el('div', 'options');
    box.setAttribute('role', 'group');
    box.setAttribute('aria-label', q.title);

    q.options.forEach(function (opt) {
      var b = el('button', 'option');
      b.type = 'button';
      b.appendChild(el('span', null, opt.value));
      b.appendChild(el('i'));
      b.addEventListener('click', function () { choose(q, opt, b, box); });
      box.appendChild(b);
    });
    c.appendChild(box);

    if (history.length) {
      var back = el('button', 'back', '← Back');
      back.type = 'button';
      back.addEventListener('click', goBack);
      c.appendChild(back);
    }

    show(c);
  }

  function choose(q, opt, button, box) {
    answers[q.id] = opt.value;
    history.push(q.id);

    /* Flash the selection before advancing so the tap visibly registers. */
    Array.prototype.forEach.call(box.children, function (child) {
      child.disabled = true;
      child.classList.remove('on');
    });
    button.classList.add('on');

    setTimeout(function () {
      if (nextUnanswered()) renderQuestion(); else renderContact();
    }, 270);
  }

  function goBack() {
    var last = history.pop();
    if (!last) return renderIntro();
    delete answers[last];

    /* Stepping back off "financing" or "received a quote" must also drop the
       follow-up it revealed, so its points can't linger. */
    Object.keys(answers).forEach(function (id) {
      var q = QUESTIONS.filter(function (x) { return x.id === id; })[0];
      if (q && typeof q.showIf === 'function' && !q.showIf(answers)) {
        delete answers[id];
        var i = history.indexOf(id);
        if (i !== -1) history.splice(i, 1);
      }
    });

    renderQuestion();
  }

  /* ---------- screen: contact ---------- */

  function renderContact() {
    setProgress(visible().length + 1);

    var c = el('div');
    c.appendChild(el('p', 'eyebrow', 'Almost there'));
    c.appendChild(el('h2', null, 'Where should we send your appointment details?'));
    c.appendChild(el('p', 'help', "We'll use these details to confirm your appointment. We never sell your information."));

    var form = el('form');
    form.noValidate = true;

    var grid = el('div', 'fields');
    CONTACT_FIELDS.forEach(function (f) {
      var field = el('div', 'field s' + f.span);
      var label = el('label', null, f.label);
      label.htmlFor = 'f_' + f.name;

      var input = document.createElement('input');
      input.id = 'f_' + f.name;
      input.type = f.type;
      input.name = f.name;
      input.autocomplete = f.autocomplete;
      input.value = contact[f.name] || '';
      if (f.maxlength) input.maxLength = f.maxlength;
      if (f.inputmode) input.inputMode = f.inputmode;
      if (f.placeholder) input.placeholder = f.placeholder;

      /* Builder Prime expects the two-letter code, so normalise as they type
         rather than rejecting "mo" or "Mo" at validation. */
      if (f.uppercase) {
        input.addEventListener('input', function () {
          this.value = this.value.toUpperCase();
        });
      }

      field.appendChild(label);
      field.appendChild(input);
      field.appendChild(el('span', 'msg'));
      grid.appendChild(field);
    });
    form.appendChild(grid);

    /* Optional by design - see the note on CONTACT_FIELDS. validate() never
       looks at it, so the form submits and books normally when it is left
       unticked; the visitor simply gets no automated outreach. */
    var consent = el('label', 'consent');
    var consentBox = document.createElement('input');
    consentBox.type = 'checkbox';
    consentBox.name = 'smsOptIn';
    consentBox.checked = smsOptIn;
    consentBox.addEventListener('change', function () {
      smsOptIn = this.checked;
      smsOptInAt = this.checked ? new Date().toISOString() : null;
    });
    var consentCopy = el('span');
    consentCopy.innerHTML = CONSENT_HTML;
    consent.appendChild(consentBox);
    consent.appendChild(consentCopy);
    form.appendChild(consent);

    var err = el('p', 'err');
    err.hidden = true;
    err.style.marginTop = '14px';
    form.appendChild(err);

    var submit = el('button', 'btn block', 'See my appointment options');
    submit.type = 'submit';
    submit.style.marginTop = '18px';
    form.appendChild(submit);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!validate(form, err)) return;
      CONTACT_FIELDS.forEach(function (f) { contact[f.name] = form.elements[f.name].value.trim(); });
      smsOptIn = form.elements.smsOptIn.checked;
      if (smsOptIn && !smsOptInAt) smsOptInAt = new Date().toISOString();
      submitLead();
    });

    c.appendChild(form);

    var back = el('button', 'back', '← Back');
    back.type = 'button';
    back.addEventListener('click', goBack);
    c.appendChild(back);

    show(c);
  }

  function validate(form, errNode) {
    var ok = true, firstBad = null;

    CONTACT_FIELDS.forEach(function (f) {
      var input = form.elements[f.name];
      var v = input.value.trim();
      var msg = '';

      if (!v) msg = f.label + ' is required.';
      else if (f.name === 'fullName' && v.length < 2) msg = 'Enter your full name.';
      else if (f.name === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) msg = 'Enter a valid email address.';
      else if (f.name === 'phone' && v.replace(/\D/g, '').length < 10) msg = 'Enter a 10-digit phone number.';
      else if (f.name === 'state' && !/^[A-Za-z]{2}$/.test(v)) msg = 'Use the 2-letter state code, e.g. MO.';
      else if (f.name === 'zip' && !/^\d{5}$/.test(v)) msg = 'Enter a 5-digit ZIP code.';

      var field = input.parentNode;
      field.querySelector('.msg').textContent = msg;
      field.classList.toggle('bad', !!msg);
      input.setAttribute('aria-invalid', msg ? 'true' : 'false');

      if (msg) { ok = false; if (!firstBad) firstBad = input; }
    });

    errNode.hidden = ok;
    errNode.textContent = ok ? '' : 'Please check the highlighted fields.';
    if (firstBad) firstBad.focus();
    return ok;
  }

  /* ---------- submission ---------- */

  function attribution() {
    var p = new URLSearchParams(window.location.search), out = {};
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'gclid', 'fbclid']
      .forEach(function (k) { if (p.get(k)) out[k] = p.get(k); });
    return out;
  }

  function submitLead() {
    renderSending();

    var s = tally();
    var payload = {
      submittedAt: new Date().toISOString(),
      startedAt: startedAt,
      contact: contact,
      answers: answers,
      answerDetail: s.detail,
      disqualified: s.disqualified,
      rawScore: s.rawScore,
      enthusiasmBonus: s.enthusiasmBonus,
      effectiveScore: s.effectiveScore,
      priority: s.priority,
      oneLegger: s.oneLegger,
      oneLeggerPenalty: s.oneLeggerPenalty,
      scoreBeforePenalty: s.scoreBeforePenalty,
      sms_email_opt_in: smsOptIn,
      consent_text_version: CONSENT_VERSION,
      consent_text: CONSENT_TEXT,
      consent_captured_at: smsOptInAt,
      attribution: attribution(),
      page: { url: window.location.href, referrer: document.referrer || null }
    };

    /* Always keep a local copy, so a webhook outage never loses the lead. */
    try {
      var saved = JSON.parse(window.localStorage.getItem('be_leads') || '[]');
      saved.push(payload);
      window.localStorage.setItem('be_leads', JSON.stringify(saved));
    } catch (e) { /* private browsing or quota - not worth failing the booking */ }

    if (!WEBHOOK_URL || WEBHOOK_URL === 'YOUR_MAKE_WEBHOOK_URL_HERE') {
      console.info('[Bathroom Excellence] No webhook configured yet. Payload:', payload);
      return setTimeout(function () { renderResult(s, true); }, 500);
    }

    /* Disqualified leads are a different business process: recorded in Builder
       Prime and marked, but never alerted as a hot lead and never queued for a
       call. Sending them somewhere else is what guarantees that, rather than
       relying on a filter in the shared intake scenario. */
    var target = (s.disqualified && DQ_WEBHOOK_URL) ? DQ_WEBHOOK_URL : WEBHOOK_URL;

    /* Runs alongside the main submission, not after it - the two calls take
       roughly the same time, so by the time we're ready to show the
       calendar the source check has usually already resolved. See
       LEAD_SOURCE_URL above for why this matters before slots are offered
       rather than after. */
    var sourceCheck = checkLeadSource(contact.phone);

    var submit = fetch(target, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (res) { return res.ok; })
      .catch(function (error) {
        console.error('[Bathroom Excellence] Submission failed:', error);
        return false;
      });

    Promise.all([submit, sourceCheck]).then(function (r) { renderResult(s, r[0]); });
  }

  function renderSending() {
    progressEl.hidden = true;
    var c = el('div', 'intro');
    c.appendChild(el('h2', null, 'Matching you with our availability…'));
    c.appendChild(el('div', 'spinner'));
    show(c);
  }

  /* ---------- booking calendar ---------- */

  /* All slot maths happens in the company's timezone. The visitor's clock
     is irrelevant - and often wrong by an hour or more. */

  function partsInTZ(ms) {
    var f = new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit'
    });
    var p = {};
    f.formatToParts(new Date(ms)).forEach(function (x) { p[x.type] = x.value; });
    return { y: +p.year, m: +p.month, d: +p.day, wd: p.weekday };
  }

  /* Offset of TZ from UTC at a given instant, in ms. Positive west of
     Greenwich would be negative here - Chicago returns -5h or -6h. */
  function tzOffsetMs(ms) {
    var f = new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, hour12: false, year: 'numeric', month: '2-digit',
      day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    var p = {};
    f.formatToParts(new Date(ms)).forEach(function (x) { p[x.type] = x.value; });
    var asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
    return asUTC - ms;
  }

  /* Epoch ms for a wall-clock time in TZ. Two passes so the offset is
     read at roughly the right instant; our slots sit nowhere near the
     2am DST switch, so this always settles. */
  function epochFor(y, m, d, hh, mm) {
    var guess = Date.UTC(y, m - 1, d, hh, mm, 0);
    var t = guess - tzOffsetMs(guess);
    return guess - tzOffsetMs(t);
  }

  function timeLabel(hhmm) {
    var h = +hhmm.slice(0, 2), m = hhmm.slice(3);
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ':' + m + ' ' + ampm;
  }

  function dayLabel(ms) {
    return new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, weekday: 'long', month: 'short', day: 'numeric'
    }).format(new Date(ms));
  }

  function iso(p) {
    return p.y + '-' + String(p.m).padStart(2, '0') + '-' + String(p.d).padStart(2, '0');
  }

  function fetchAvailability() {
    return fetch(AVAILABILITY_URL, { method: 'GET' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        return {
          now: +j.now || Date.now(),
          /* Any meeting blocks the hour, cancelled included. The booking
             step counts them the same way, and the two have to agree -
             otherwise a cancelled meeting's slot gets offered here and
             refused there, and the visitor loops. To free a cancelled
             slot, delete the meeting in Builder Prime. */
          busy: (j.busy || []).filter(function (b) { return b && b.s; }),
          marks: (j.marks || []).filter(function (m) { return m && m.d; })
        };
      });
  }

  /* Build the offer grid: every agent's standing schedule, minus what
     Builder Prime already has, minus blackouts, minus anything too soon.

     Note we never offer a slot an agent is already on. Priority leads
     are exactly the ones Jack said must never be double booked, and the
     calendar is only ever shown to priority leads. */
  /* The slot start times the visitor's time-of-day answer allows, or null
     when they never answered. Read off the option's `band` so the wording on
     screen can change without touching the calendar. */
  function preferredTimes() {
    /* A one-legger sees evening times only, whatever they picked. Daytime is
       where Jack loses these visits - the second decision maker is at work -
       so the evening band overrides the visitor's own preference rather than
       narrowing it. */
    if (isOneLegger()) return ONE_LEGGER_BAND;
    var q = null;
    for (var i = 0; i < QUESTIONS.length; i++) {
      if (QUESTIONS[i].id === 'timeOfDay') { q = QUESTIONS[i]; break; }
    }
    if (!q) return null;
    var opt = optionOf(q, answers.timeOfDay);
    return (opt && opt.band && opt.band.length) ? opt.band : null;
  }

  function buildDays(avail, times) {
    var now = avail.now;
    var quoteFirst = QUOTE_FIRST_ANSWERS.indexOf(answers.otherQuotes) > -1;
    /* Same five-day push as a self-reported "no quote yet" - a shared lead
       means other companies got this same lead and are quoting it too,
       whether or not the visitor mentioned it. */
    var hours = (quoteFirst || leadSource.shared)
      ? QUOTE_FIRST_NOTICE_HOURS
      : MIN_NOTICE_HOURS;
    var earliest = now + hours * 3600000;
    var out = [];

    for (var i = 0; i <= HORIZON_DAYS; i++) {
      /* Noon UTC lands on the same calendar day in Chicago, so stepping
         by whole days never skips or repeats one across a DST change. */
      var probe = Date.UTC(partsInTZ(now).y, partsInTZ(now).m - 1, partsInTZ(now).d, 12) + i * 86400000;
      var p = partsInTZ(probe);
      var date = iso(p);
      var slots = [];

      times.forEach(function (t) {
        var start = epochFor(p.y, p.m, p.d, +t.slice(0, 2), +t.slice(3));
        var end = start + SLOT_MINUTES * 60000;
        if (start < earliest) return;

        var free = AGENTS.filter(function (a) {
          if (a.days.indexOf(p.wd) === -1) return false;

          var clash = avail.busy.some(function (b) {
            return b.e === a.id && b.s < end && b.n > start;
          });
          if (clash) return false;

          var blocked = avail.marks.some(function (m) {
            if (String(m.a || '').toLowerCase() !== a.name.toLowerCase()) return false;
            if (m.t === 'blackout') return m.d === date && (m.b === 'ALL' || m.b === t);
            if (m.t === 'booked') return m.s === start;
            if (m.t === 'hold') return m.s === start && m.x > now;
            return false;
          });
          return !blocked;
        });

        if (!free.length) return;

        /* Both available: give it to whoever has the lighter day, and
           alternate on a tie. Without the tie-break the first-listed
           consultant takes every slot on a quiet week. */
        var dayStart = epochFor(p.y, p.m, p.d, 0, 0);
        var load = function (ag) {
          return avail.busy.filter(function (x) {
            return x.e === ag.id && x.s >= dayStart && x.s < dayStart + 86400000;
          }).length;
        };
        var lightest = Math.min.apply(null, free.map(load));
        var tied = free.filter(function (a) { return load(a) === lightest; });
        var pick = tied[(p.d + SLOT_TIMES.indexOf(t)) % tied.length];

        slots.push({
          time: t, label: timeLabel(t), epoch: start, date: date,
          agent: pick.name, agentId: pick.id
        });
      });

      if (slots.length) out.push({ date: date, label: dayLabel(probe), slots: slots });
    }
    return out;
  }

  /* Free text goes into a hand-built JSON body on the Make side, so
     strip the characters that would break it rather than trying to
     escape them downstream. */
  function clean(v) {
    return String(v == null ? '' : v)
      .replace(/[\\"\u0000-\u001f]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function bookingPayload(s, slot) {
    var d = s.detail || {};
    var pts = function (k) { return d[k] ? d[k].points : 0; };
    var full = [contact.address, contact.city, contact.state, contact.zip]
      .filter(Boolean).join(', ');

    return {
      start_epoch: String(slot.epoch),
      appt_date: slot.date,
      appt_time: slot.time,
      agent: slot.agent,
      agent_id: String(slot.agentId),
      score: String(s.rawScore),
      priority: s.priority,
      full_name: clean(contact.fullName),
      email: clean(contact.email),
      phone: clean(contact.phone),
      address: clean(full),
      project_type: clean(answers.projectType),
      urgency: clean(answers.urgency),
      quotes: clean(answers.otherQuotes),
      credit: clean(answers.credit || answers.payment),
      dm: clean(answers.decisionMakers),
      house_story: clean(answers.houseStory),
      /* Sent so the consultant sees it on the appointment and so the wasted
         one-legger visits stay countable after the fact. */
      one_legger_risk: s.oneLegger ? 'YES' : 'NO',
      s_one_legger: String(s.oneLeggerPenalty || 0),
      score_before_penalty: String(s.scoreBeforePenalty),
      /* What the pre-calendar Builder Prime check saw, for cross-checking
         against the booking scenario's own (authoritative) lookup - they
         should always agree, since it's the same phone number moments
         apart. A mismatch would mean Builder Prime got a new record for
         this person in between, which is worth knowing about. */
      web_precheck_shared: leadSource.shared ? 'YES' : 'NO',
      web_precheck_source: clean(leadSource.source || ''),
      engagement: clean(answers.enthusiasm),
      time_of_day: clean(answers.timeOfDay),
      payment: clean(answers.payment),
      lead_source: 'Scored Web Form',
      /* Advisory only: the booking scenario may ADD the consent tag from this,
         never remove it. Only a STOP reply revokes consent. */
      sms_email_opt_in: String(smsOptIn),
      notes: 'Self-booked online. No call notes.',
      s_urgency: String(pts('urgency')),
      s_quotes: String(pts('otherQuotes')),
      s_dm: String(pts('decisionMakers')),
      s_credit: String(pts('credit') || pts('payment')),
      s_engagement: String(d.enthusiasm ? d.enthusiasm.bonus : 0)
    };
  }

  function renderCalendar(s) {
    setProgress(visible().length + 2);

    var c = el('div', 'intro');

    /* First thing on the card, before the badge, because it has to be read
       before a time is picked - not after. */
    var lead500 = el('div', 'cal-alert');
    lead500.innerHTML = 'Please select an appointment time when all decision makers can be present.' +
      '<span class="cal-alert-sub"><strong>A $500 discount</strong> will be given at the time of the ' +
      'appointment if all necessary decision makers are present. Please choose carefully.</span>';
    c.appendChild(lead500);

    /* Without this the evening-only override just looks like we have no
       daytime availability, and they call in to ask. Say why instead. */
    if (isOneLegger()) {
      var evOnly = el('p', 'note');
      evOnly.innerHTML = '<strong>We’re showing you evening times only.</strong> ' +
        'Our consultant covers design options, measurements and a full priced ' +
        'proposal in one visit, and everyone involved in the decision should be ' +
        'there to see it — evenings are when that actually works. Need a daytime ' +
        'appointment? Call ' + PHONE + ' and we’ll arrange it.';
      c.appendChild(evOnly);
    }

    var badge = el('div', 'badge'); badge.appendChild(tick()); c.appendChild(badge);
    c.appendChild(el('h2', null, "Great — you're ready to choose an appointment."));
    c.appendChild(el('p', 'lead', "We've matched your project with our current appointment availability."));

    var slotArea = el('div', 'cal');
    slotArea.appendChild(el('div', 'spinner'));
    c.appendChild(slotArea);
    show(c);

    fetchAvailability().then(function (avail) {
      var pref = preferredTimes();
      var days = buildDays(avail, pref || SLOT_TIMES);
      var widened = false;

      /* One band is two of six slots, so a busy fortnight can empty it. Show
         the rest rather than sending a priority lead to the callback screen
         while other times sit open.

         Never widen for a one-legger: offering them a daytime slot is the
         wasted visit this rule exists to prevent. If the evenings really are
         full they go to the callback screen, where a person can work it out
         with them. */
      if (!days.length && pref && !isOneLegger()) {
        days = buildDays(avail, SLOT_TIMES);
        widened = days.length > 0;
      }

      slotArea.innerHTML = '';

      if (!days.length) {
        fallbackToCall(c, slotArea, s);
        return;
      }

      if (widened) {
        var band = String(answers.timeOfDay || '').split(' ')[0].toLowerCase();
        var wide = el('p', 'note');
        wide.innerHTML = '<strong>We don’t have a ' + band + ' opening in the next three weeks.</strong> ' +
          'Here’s everything else that’s free — or call ' + PHONE + ' and we’ll find you a ' + band + '.';
        c.insertBefore(wide, slotArea);
      }

      var shown = 5;
      var paint = function () {
        slotArea.innerHTML = '';
        days.slice(0, shown).forEach(function (day) {
          var box = el('div', 'cal-day');
          var h = el('h3', null, day.label);
          box.appendChild(h);
          var row = el('div', 'cal-times');
          day.slots.forEach(function (slot) {
            var b = el('button', 'cal-slot', slot.label);
            b.type = 'button';
            b.addEventListener('click', function () { renderConfirm(s, slot); });
            row.appendChild(b);
          });
          box.appendChild(row);
          slotArea.appendChild(box);
        });

        if (shown < days.length) {
          var more = el('p', 'cal-more');
          var mb = el('button', null, 'Show more dates');
          mb.type = 'button';
          mb.addEventListener('click', function () { shown = days.length; paint(); });
          more.appendChild(mb);
          slotArea.appendChild(more);
        }
      };
      paint();

      var pri = el('p', 'note');
      pri.innerHTML = '<strong>You have priority access.</strong> Pick any time above and it’s yours — ' +
        'these slots are held for you and won’t be double booked. Questions first? Call ' + PHONE + '.';
      c.appendChild(pri);
      c.appendChild(expectNote());

    }).catch(function (err) {
      console.error('[Bathroom Excellence] Availability lookup failed:', err);
      fallbackToCall(c, slotArea, s);
    });
  }

  function expectNote() {
    var what = el('p', 'note');
    what.innerHTML = '<strong>What to expect.</strong> At the time of your appointment our design ' +
      'specialist will be going over design options, taking measurements, and will be presenting a ' +
      'full detailed priced proposal for the project you are looking for. Please set aside ' +
      'approximately 90 minutes to complete this process.';
    return what;
  }

  /* Availability is down, or genuinely nothing open in the window. Either
     way the visitor should never see an error - they see the priority
     callback promise instead. */
  function fallbackToCall(c, slotArea, s) {
    slotArea.remove();

    /* The heading promised a calendar. There isn't one, so say the other
       true thing instead rather than leaving a dangling invitation. */
    var name = (contact.fullName || '').trim().split(/\s+/)[0];
    var h = c.querySelector('h2');
    if (h) {
      h.textContent = name
        ? 'You’re at the front of the line, ' + name + '.'
        : 'You’re at the front of the line.';
    }
    var lead = c.querySelector('.lead');
    if (lead) {
      lead.textContent =
        'We’ve matched your project with our current availability and flagged it for priority booking.';
    }

    var call = el('p', 'note');
    call.innerHTML = '<strong>A senior design consultant will call you shortly.</strong> ' +
      'Because your project is flagged as priority, you get first choice of our open times — ' +
      'including evenings and Saturdays. Don’t want to wait? Call ' + PHONE + ' now and ' +
      'mention you just finished the online scheduler.';
    c.appendChild(call);
    c.appendChild(expectNote());
  }

  /* Nothing is booked until this screen is confirmed. It exists so a visitor
     who picked a time their co-decider can't make has a way back - before an
     appointment is on a real calendar, not after. */
  function renderConfirm(s, slot) {
    var c = el('div', 'intro');
    c.appendChild(el('h2', null, 'Confirm your appointment'));

    var when = el('p', 'lead');
    when.innerHTML = '<strong>' + dayLabel(slot.epoch) + ' at ' + slot.label + '</strong>';
    c.appendChild(when);

    var warn = el('p', 'warn');
    warn.innerHTML = 'Just double checking \u2014 did you accidentally choose an appointment time ' +
      'that may <strong>disqualify you for the $500 discount</strong>? If so, go back and choose a ' +
      'time when all decision makers, or parties involved in the decision, can be present \u2014 ' +
      'to conserve everyone\u2019s time.';
    c.appendChild(warn);

    /* Deliberately above Confirm: the way out belongs next to the reason for
       taking it, not below the button that commits. */
    var back = el('button', 'back-warn', '\u2190 Back to the calendar');
    back.type = 'button';
    back.addEventListener('click', function () { renderCalendar(s); });
    c.appendChild(back);

    var note = el('p', 'note');
    note.innerHTML = '<strong>Press Confirm and you\u2019re booked.</strong> ' +
      'You\u2019ll receive a confirmation within five minutes with your appointment ' +
      'time and details.';
    c.appendChild(note);

    var go = el('button', 'btn block', 'Confirm appointment');
    go.type = 'button';
    go.style.marginTop = '18px';
    go.addEventListener('click', function () { bookSlot(s, slot); });
    c.appendChild(go);

    show(c);
  }

  function bookSlot(s, slot) {
    progressEl.hidden = true;
    var c = el('div', 'intro');
    c.appendChild(el('h2', null, 'Reserving your appointment…'));
    c.appendChild(el('div', 'spinner'));
    show(c);

    var body = new URLSearchParams(bookingPayload(s, slot));

    /* No custom headers: URLSearchParams keeps this a "simple" request,
       so the browser never fires a CORS preflight at the webhook. */
    fetch(BOOK_URL, { method: 'POST', body: body })
      .then(function (r) {
        if (r.status === 409) return { taken: true };
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (j) {
        if (j.taken) return renderTaken(s);

        /* The slot gets claimed either way, but only a 201 back from
           Builder Prime means the appointment actually exists on a
           calendar. Anything else and we say "call us" rather than
           promise a visit nobody is booked for. */
        if (j.created !== 201) {
          console.error('[Bathroom Excellence] Slot claimed but Builder Prime returned', j.created);
          return renderBookFailed(s, slot);
        }
        renderBooked(s, slot);
      })
      .catch(function (err) {
        console.error('[Bathroom Excellence] Booking failed:', err);
        renderBookFailed(s, slot);
      });
  }

  function renderBooked(s, slot) {
    var c = el('div', 'intro');
    var badge = el('div', 'badge'); badge.appendChild(tick()); c.appendChild(badge);

    var name = (contact.fullName || '').trim().split(/\s+/)[0];
    c.appendChild(el('h2', null, name ? "You're all set, " + name + '.' : "You're all set."));

    var when = el('p', 'lead');
    when.innerHTML = 'We’ll see you <strong>' + dayLabel(slot.epoch) + ' at ' + slot.label + '</strong>.';
    c.appendChild(when);

    var conf = el('p', 'note');
    conf.innerHTML = '<strong>A confirmation text and email are on the way!</strong> ' +
      'Check ' + (contact.email || 'your inbox') + '. If you need to reschedule, just reply to the ' +
      'confirmation text, or call ' + RESCHEDULE_PHONE + '.';
    c.appendChild(conf);
    c.appendChild(expectNote());
    show(c);
  }

  function renderTaken(s) {
    var c = el('div', 'intro');
    c.appendChild(el('h2', null, 'That time just went.'));
    c.appendChild(el('p', 'lead',
      'Someone booked it while you were deciding. Here’s what’s still open — your priority access hasn’t changed.'));
    show(c);
    setTimeout(function () { renderCalendar(s); }, 1400);
  }

  function renderBookFailed(s, slot) {
    var c = el('div', 'intro');
    var badge = el('div', 'badge'); badge.appendChild(tick()); c.appendChild(badge);
    c.appendChild(el('h2', null, 'Your request is in.'));
    c.appendChild(el('p', 'lead',
      'We have your details and your preferred time of ' + dayLabel(slot.epoch) + ' at ' + slot.label + '.'));

    var warn = el('p', 'warn');
    warn.textContent = 'We couldn’t confirm that slot automatically. Please call ' + PHONE +
      ' to lock it in — mention you just finished the online scheduler.';
    c.appendChild(warn);
    c.appendChild(expectNote());
    show(c);
  }

  /* ---------- screen: result ---------- */

  function renderResult(s, delivered) {
    /* Priority leads pick their own time. Everything the calendar needs is
       already in hand, so hand straight over to it - it falls back to the
       callback copy by itself if availability can't be reached. */
    if (s.priority === 'High' && AVAILABILITY_URL && BOOK_URL) {
      return renderCalendar(s);
    }

    setProgress(visible().length + 2);

    var c = el('div', 'intro');

    var badge = el('div', 'badge');
    badge.appendChild(tick());
    c.appendChild(badge);

    var name = (contact.fullName || '').trim().split(/\s+/)[0];

    if (s.disqualified) {
      /* No calendar, and no promise of a call - Jack does not want these
         chased. The phone number stays so anyone whose situation changes can
         still reach us. */
      c.appendChild(el('h2', null, name ? 'Thanks, ' + name + ' — we’ve got your details.'
                                        : 'Thanks — we’ve got your details.'));
      c.appendChild(el('p', 'lead', 'We appreciate you taking the time to go through that.'));

      var dqn = el('p', 'note');
      dqn.innerHTML = '<strong>We’ll keep your details on file.</strong> If your plans or ' +
        'timing change, we’d be glad to hear from you — just call ' + PHONE + ' and we’ll ' +
        'pick things up from there.';
      c.appendChild(dqn);
      show(c);
      return;
    }

    if (s.priority === 'High') {
      c.appendChild(el('h2', null, name
        ? 'You’re at the front of the line, ' + name + '.'
        : 'You’re at the front of the line.'));
      c.appendChild(el('p', 'lead',
        'We’ve matched your project with our current availability and flagged it for priority booking.'));

      var call = el('p', 'note');
      call.innerHTML = '<strong>A senior design consultant will call you shortly.</strong> ' +
        'Because your project is flagged as priority, you get first choice of our open times — ' +
        'including evenings and Saturdays. Don’t want to wait? Call ' + PHONE + ' now and ' +
        'mention you just finished the online scheduler.';
      c.appendChild(call);

    } else {
      c.appendChild(el('h2', null, name ? 'Thanks, ' + name + ' — we’ve got what we need.' : 'Thanks — we’ve got what we need.'));
      c.appendChild(el('p', 'lead', "We've matched your project with our current appointment availability."));

      /* Standard: request a flexible window and confirm by phone. */
      var std = el('p', 'note');
      std.innerHTML = '<strong>Your appointment request is in.</strong> A design consultant will ' +
        'call you shortly to confirm a time that works around your schedule, including ' +
        'flexible morning and afternoon arrival windows. Want to lock something in now? Call ' + PHONE + '.';
      c.appendChild(std);
    }

    c.appendChild(expectNote());

    if (!delivered) {
      var warn = el('p', 'warn');
      warn.textContent = 'We saved your request, but couldn’t reach our scheduling system automatically. ' +
        'Please call ' + PHONE + ' to confirm your appointment.';
      c.appendChild(warn);
    }

    show(c);
  }

  /* ---------- go ---------- */
  renderIntro();
})();
</script>
</body>
</html>
